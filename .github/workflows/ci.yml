name: tunnelsh-backend

on: [push]

env:
    NEXT_PUBLIC_APP_URL: "https://tunnelsh.top"
    NEXT_PUBLIC_SUPABASE_URL: "https://bssmatjwdmofqzozrfvz.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:

    build:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go project
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o tunnelsh-backend main.go

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp tunnelsh-backend deploy/

          # Create startup script
          cat > deploy/start.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          mkdir -p logs
          LOG_FILE="logs/app_$(date +%Y%m%d_%H%M%S).log"
          nohup ./tunnelsh-backend > "$LOG_FILE" 2>&1 < /dev/null &
          disown
          ln -sf "$LOG_FILE" logs/latest.log
          echo "Started tunnelsh-backend with PID: $!"
          EOF
          sudo chmod +x deploy/start.sh

      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: "202.92.215.2"
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET }}
          port: 22
          source: "./deploy/*"
          target: '/home/ubuntu/tunnelsh-backend'

    deploy:
      needs: build
      if: github.ref == 'refs/heads/main'
      runs-on: [ubuntu-latest]
      steps:
          - uses: actions/checkout@v1
          - name: Push to tunnelsh server
            uses: appleboy/ssh-action@master
            with:
                host: "202.92.215.2"
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.SECRET }}
                port: 22
                script: |
                    cd ~/tunnelsh-backend/deploy

                    pkill -f 'tunnelsh-backend' || true

                    sleep 2

                    # Start using the script
                    ./start.sh

                    # Verify it started
                    sleep 1
                    if pgrep -f 'tunnelsh-backend' > /dev/null; then
                      echo "Application started successfully"
                      echo "Logs: ~/tunnelsh-backend/deploy/logs/latest.log"
                    else
                      echo "Failed to start. Check logs."
                      exit 1
                    fi